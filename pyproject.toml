[project]
name = "podpaper"
version = "0.1.0"
description = "Turn a scientific PDF into an interactive audiobook, locally."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
]

[project.scripts]
podpaper = "podpaper.cli:app"

[dependency-groups]
dev = [
    "prek>=0.5.11",
    "pytest>=8",
    "ruff>=0.8",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podpaper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not models'"
markers = [
    "models: needs downloaded models and local services (run with -m models)",
]
