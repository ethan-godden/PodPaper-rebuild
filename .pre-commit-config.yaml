# Run with prek (https://github.com/j178/prek): `uv run prek install` once.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest (fast, no models)
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]
